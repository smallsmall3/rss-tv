# ============================================================================
#  rss-tv — NAS 部署（用 GitHub Actions 构建好的 ghcr.io 镜像，推荐）
#
#  和 docker-compose.yml 的区别：image 指向 ghcr.io 上的公开镜像，
#  不需要在 NAS 上构建，升级只要 `docker compose pull && docker compose up -d`。
#
#  所有密钥与 RSS 订阅都不在本文件里填，而是通过网页 UI 配置：
#    1. 粘贴本文件到绿联云/群晖 → Docker → 项目 → 新建 → 部署
#    2. 浏览器打开 http://<NAS 的 IP>:18080/
#    3. 进「设置」页面填 Telegram / TMDB / Emby 三组密钥（保存即热生效）
#    4. 进「订阅管理」页面添加 RSS 订阅
#
#  升级：
#    docker compose pull && docker compose up -d
# ============================================================================

services:
  rss-tv:
    # 镜像由 GitHub Actions 自动构建（amd64 + arm64 双架构）
    image: ghcr.io/smallsmall3/rss-tv:latest

    container_name: rss-tv
    restart: unless-stopped

    environment:
      TZ: Asia/Shanghai

      # ---------------------------------------------------------------
      #  以下密钥与订阅一律不在这里填，改到网页 UI 里配置：
      #   - Telegram：Bot Token + Chat ID
      #   - TMDB：API Key
      #   - Emby：地址 + API Key
      #   - RSS 订阅：订阅管理页
      #
      #  想用环境变量也行（环境变量优先级高于 UI 保存的值），
      #  取消下面注释并填值即可。
      # ---------------------------------------------------------------

      # ---- Telegram（推送到手机）----
      # RMH_TG_BOT_TOKEN: ""
      # RMH_TG_CHAT_ID: ""
      # RMH_TG_PROXY: "http://192.168.31.142:10809"   # 国内直连不通就填代理

      # ---- TMDB（算剧集总集数，查漏要用）----
      # RMH_TMDB_API_KEY: ""
      # RMH_TMDB_PROXY: "http://192.168.31.142:10809"

      # ---- Emby / Jellyfin（算入库进度，按剧追踪要用）----
      # RMH_EMBY_URL: "http://192.168.31.221:8096"    # 必须是 NAS 能访问到的地址，不能用 localhost
      # RMH_EMBY_API_KEY: ""

      # ---------- 运行参数（也可进 UI 改） ----------
      RMH_POLL_INTERVAL: "180"          # RSS 刷新间隔（秒）
      RMH_EMBY_CHECK_INTERVAL: "1800"   # 媒体库全量比对间隔（秒）
      RMH_LOG_LEVEL: "INFO"

      # ---- 网页 UI ----
      RMH_WEB_PORT: "18080"
      # 留空 = 不设口令。第一次进去后建议在「设置」里加访问口令。
      # RMH_WEB_TOKEN: ""

      RMH_DATA_DIR: "/data"

    volumes:
      # 数据（订阅 + 已见条目 + 进度快照，SQLite）
      - /volume1/docker/rss-tv/data:/data
      # 通知模板（config/notify_templates.txt，可在网页 UI 编辑）
      - /volume1/docker/rss-tv/config:/app/config

    ports:
      - "18080:18080"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
