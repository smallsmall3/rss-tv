# ============================================================================
#  rss-tv — 最小启动版（第一次跑起来看界面用）
#
#  设计思路：先把容器跑起来，密钥全部在网页 UI 里填。
#  好处：
#    * 不用先折腾 token/key 才能看到界面
#    * 填错了在界面上改，保存即生效
#
#  三步走：
#    1. 粘贴本文件到绿联云/群晖 → Docker → 项目 → 新建 → 部署
#    2. 浏览器打开 http://<NAS 的 IP>:18080/
#    3. 进「设置」页面填 Telegram / TMDB / Emby，保存
#
#  升级：
#    docker compose pull && docker compose up -d
# ============================================================================

services:
  rss-tv:
    image: ghcr.io/smallsmall3/rss-tv:latest

    container_name: rss-tv
    restart: unless-stopped

    environment:
      TZ: Asia/Shanghai

      # ---------------------------------------------------------------
      #  以下是全部配置项，**故意注释掉**，请到网页 UI 里填。
      #
      #  为什么可以留空：程序在密钥缺失时会正常启动，
      #  只是对应功能不可用。
      # ---------------------------------------------------------------

      # ---- Telegram（推送到手机）----
      # RMH_TG_BOT_TOKEN: ""
      # RMH_TG_CHAT_ID: ""
      # RMH_TG_PROXY: "http://192.168.31.142:10809"   # 国内直连不通就填代理

      # ---- TMDB（算剧集总集数，查漏要用）----
      # RMH_TMDB_API_KEY: ""
      # RMH_TMDB_PROXY: "http://192.168.31.142:10809"

      # ---- Emby / Jellyfin（算入库进度，按剧追踪要用）----
      # RMH_EMBY_URL: "http://192.168.31.221:8096"    # 必须是 NAS 能访问到的地址，不能用 localhost
      # RMH_EMBY_API_KEY: ""

      # ---- 运行参数（想改也可以进界面改）----
      RMH_POLL_INTERVAL: "180"          # RSS 刷新间隔（秒）
      RMH_EMBY_CHECK_INTERVAL: "1800"   # 媒体库全量比对间隔（秒）
      RMH_LOG_LEVEL: "INFO"

      # ---- 网页 UI ----
      RMH_WEB_PORT: "18080"
      # 留空 = 不设口令。第一次进去后建议在「设置」里加访问口令。
      # RMH_WEB_TOKEN: ""

      RMH_DATA_DIR: "/data"

    volumes:
      - /volume1/docker/rss-tv/data:/data
      - /volume1/docker/rss-tv/config:/app/config

    ports:
      - "18080:18080"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
