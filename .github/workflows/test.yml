name: Tests

# ============================================================================
#  每次 push / PR 自动跑单元测试
#  测试全部离线（不联网、不需要任何密钥），所以 CI 里很稳
# ============================================================================

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    name: test (py${{ matrix.python-version }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile check
        run: python -m compileall -q app tests

      - name: Run unit tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee /tmp/test-output.txt

      - name: 把测试结果写入 job summary（失败时也能直接看到）
        if: always()
        run: |
          {
            echo "## 测试输出（py${{ matrix.python-version }}）"
            echo ""
            echo '```'
            if [ -f /tmp/test-output.txt ]; then
              grep -E '^(FAIL|ERROR):|AssertionError|^Ran |^OK|^FAILED' /tmp/test-output.txt | head -60 || true
              echo "---- 最后 40 行 ----"
              tail -40 /tmp/test-output.txt
            else
              echo "没有拿到测试输出"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: CLI 冒烟测试（确认 CLI 能正常加载）
        run: |
          set -e
          export RMH_WEB_PORT=0
          python -m app --help
          python -c "from app.version import __version__; print('version', __version__)"
